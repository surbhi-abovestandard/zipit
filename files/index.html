<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIPIT – Instant, Secure CS2 skins trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="#" aria-label="ZIPIT home">
    <svg viewBox="0 0 40 32" width="34" height="28" aria-hidden="true"><path d="M2 2h22l-9 11h9L8 30l4-13H2z" fill="#9b4dff"/><path d="M18 2h20L22 30h-6l10-17h-8z" fill="#6a2fd6"/></svg>
    <span>ZIPIT</span>
  </a>
  <nav class="main-nav" aria-label="Main"><a href="#">Buy</a><a href="#">Sell</a></nav>
  <label class="search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" placeholder="Search for an items">
  </label>
  <div class="header-actions">
    <button class="currency" type="button"><span class="flag" aria-hidden="true"></span><span class="currency-text">$ USD</span></button>
    <a class="btn btn-steam" href="#">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="11" opacity=".25"/><circle cx="14.5" cy="9.5" r="3.2"/><circle cx="8.5" cy="15.5" r="2"/></svg>
      <span>Sign in <span class="hide-sm">via Steam</span></span>
    </a>
  </div>
</header>

<section class="skin-category-slider" aria-label="Popular skins">
  <div class="skin-track" id="skinTrack"></div>
</section>

<section class="hero-section" id="hero">
  <div class="hero-background" aria-hidden="true">
    <div class="bg-base"></div>
    <div class="bg-glow glow-purple"></div>
    <div class="bg-glow glow-blue"></div>
    <div class="bg-glow glow-pink"></div>
    <div class="bg-glow glow-mouse" id="glowMouse"></div>
    <div class="bg-beams"></div>
    <div class="bg-fog fog-a"></div>
    <div class="bg-fog fog-b"></div>
    <div class="bg-floor"></div>
    <div class="bg-particles" id="particles"></div>
  </div>

  <div class="hero-inner">
    <div class="hero-content" id="heroContent">
      <h1 id="heroTitle"></h1>
      <p id="heroText"></p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#">Trade skins now <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></a>
        <a class="link-bonus" href="#">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v8h14v-8M12 8v12M12 8c-3 0-4.5-3-2.5-4S12 6 12 8zm0 0c3 0 4.5-3 2.5-4S12 6 12 8z"/></svg>
          Register &amp; Get $5 bonus
        </a>
      </div>
    </div>
    <div class="hero-slider hero-media" id="heroMedia"></div>
  </div>

  <div class="hero-pagination" id="heroPagination" role="tablist" aria-label="Hero slides"></div>
</section>

<script src="script.js"></script>
</body>
</html>
